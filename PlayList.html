<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TRPG Session Archive</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      background: #1e1e1e;
      color: #f5f5f5;
      font-family: sans-serif;
    }

    h1 {
      margin-bottom: 24px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 24px;
    }

    input,
    select {
      padding: 10px;
      border-radius: 8px;
      border: none;
      font-size: 14px;
    }

    .card-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
    }

    .card {
      background: #2b2b2b;
      border-radius: 16px;
      padding: 20px;
      border: 1px solid #444;
    }

    .title {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .meta {
      color: #cccccc;
      margin-bottom: 10px;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }

    .tag {
      background: #444;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }

    .links a {
      background: #5a67d8;
      color: white;
      text-decoration: none;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 14px;
    }

    .memo {
      background: #222;
      padding: 12px;
      border-radius: 10px;
      color: #ddd;
    }
  </style>
</head>

<body>

  <h1>TRPG Session Archive</h1>

  <div class="controls">

    <input
      type="text"
      id="searchInput"
      placeholder="シナリオ名検索">

    <select id="playerCountFilter">
      <option value="">人数すべて</option>
      <option value="2">2PL</option>
      <option value="3">3PL</option>
      <option value="4">4PL</option>
      <option value="5">5PL</option>
    </select>

    <input
      type="text"
      id="playerFilter"
      placeholder="PL名検索">

  </div>

  <div
    class="card-container"
    id="cardContainer">
  </div>

  <script>

    const sessions = [

      {
        title: "ラディアントアビス",

        date: "2026-05-24",

        system: "CoC",

        playerCount: 4,

        kp: "KP太郎",

        players: [
          "Mai",
          "A",
          "B",
          "C"
        ],

        playlistUrl: "https://youtube.com/",

        videos: [
          {
            title: "Part1",
            url: "https://youtube.com/"
          },
          {
            title: "Part2",
            url: "https://youtube.com/"
          }
        ],

        memo: "地獄だった"

      },

      {
        title: "星の神話、エンドロール",

        date: "2026-04-10",

        system: "CoC",

        playerCount: 3,

        kp: "KP花子",

        players: [
          "Mai",
          "D",
          "E"
        ],

        playlistUrl: "https://youtube.com/",

        videos: [
          {
            title: "Part1",
            url: "https://youtube.com/"
          }
        ],

        memo: "泣いた"

      }

    ];

    const cardContainer =
      document.getElementById("cardContainer");

    const searchInput =
      document.getElementById("searchInput");

    const playerCountFilter =
      document.getElementById("playerCountFilter");

    const playerFilter =
      document.getElementById("playerFilter");

    function renderCards() {

      const searchText =
        searchInput.value.toLowerCase();

      const playerCount =
        playerCountFilter.value;

      const playerSearch =
        playerFilter.value.toLowerCase();

      cardContainer.innerHTML = "";

      const filtered = sessions.filter(session => {

        const matchesTitle =
          session.title
            .toLowerCase()
            .includes(searchText);

        const matchesPlayerCount =
          !playerCount ||
          session.playerCount == playerCount;

        const matchesPlayer =
          !playerSearch ||
          session.players.some(player =>
            player
              .toLowerCase()
              .includes(playerSearch)
          );

        return (
          matchesTitle &&
          matchesPlayerCount &&
          matchesPlayer
        );

      });

      filtered.forEach(session => {

        const card =
          document.createElement("div");

        card.className = "card";

        card.innerHTML = `

          <div class="title">
            ${session.title}
          </div>

          <div class="meta">
            ${session.system}
            /
            ${session.playerCount}PL
            /
            ${session.date}
          </div>

          <div class="meta">
            KP：${session.kp}
          </div>

          <div class="tags">

            ${session.players.map(player => `
              <div class="tag">
                #${player}
              </div>
            `).join("")}

          </div>

          <div class="links">

            <a
              href="${session.playlistUrl}"
              target="_blank">

              再生リスト

            </a>

            ${session.videos.map(video => `
              <a
                href="${video.url}"
                target="_blank">

                ${video.title}

              </a>
            `).join("")}

          </div>

          <div class="memo">
            ${session.memo}
          </div>

        `;

        cardContainer.appendChild(card);

      });

    }

    searchInput.addEventListener(
      "input",
      renderCards
    );

    playerCountFilter.addEventListener(
      "change",
      renderCards
    );

    playerFilter.addEventListener(
      "input",
      renderCards
    );

    renderCards();

  </script>

</body>

</html>
